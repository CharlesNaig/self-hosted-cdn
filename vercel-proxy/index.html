<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Public asset delivery for Naig projects." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/cdn-logo.png" />
    <title>Naig CDN</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101311;
        color: #e4e9e4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      .shell { width: min(100%, 35rem); }
      .logo { width: 5rem; height: 5rem; margin-bottom: 1.5rem; border-radius: 1rem; }
      .label {
        margin: 0 0 2.25rem;
        color: #9bb5a0;
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .18em;
      }
      h1 { margin: 0; font-size: clamp(3.25rem, 11vw, 5rem); font-weight: 650; letter-spacing: -.07em; line-height: .95; }
      .description { margin: 1.25rem 0 2rem; color: #aeb8af; font-size: 1rem; line-height: 1.6; }
      .status { display: flex; align-items: center; gap: .55rem; margin: 0 0 2.5rem; color: #c8d5c9; font-size: .88rem; }
      .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #6eaa77; }
      .panel { border: 1px solid #2b332d; border-radius: .6rem; overflow: hidden; }
      .panel p { margin: 0; padding: .95rem 1rem; color: #b9c3ba; font-size: .9rem; }
      .panel p + p { border-top: 1px solid #2b332d; }
      footer { margin-top: 2rem; color: #768077; font-size: .78rem; }
      @media (max-width: 420px) { main { padding: 1.5rem; } .label { margin-bottom: 1.75rem; } }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="cdn-heading">
        <img class="logo" src="/cdn-logo.png" alt="" width="80" height="80" />
        <p class="label">NAIG</p>
        <h1 id="cdn-heading">CDN</h1>
        <p class="description">A self-hosted, content-addressed delivery layer for Naig projects. Management stays private; public access is read-only.</p>
        <p class="status"><span class="dot" aria-hidden="true"></span>Operational</p>
        <div class="panel" aria-label="CDN information">
          <p>Direct asset URLs only</p>
          <p>Uploads and management are private</p>
          <p>Long-lived cached delivery</p>
        </div>
        <footer>© 2026 Naig</footer>
      </section>
    </main>
  </body>
</html>
